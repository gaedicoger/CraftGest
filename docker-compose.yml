name: craftgest
services:
    # Database - PostgreSQL
  postgres:
    image: postgres:18-alpine
    container_name: craftgest-postgres
    ports:
      - "5433:5432"
    env_file:
      - ./back/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

networks:
  default:
    name: craftgest-network